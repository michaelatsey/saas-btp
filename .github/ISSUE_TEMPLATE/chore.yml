name: Chore
description: Internal work (tooling, CI, refactor, docs) with no direct user value.
title: "[ctx:<context>] chore: <imperative description>"
labels: ["type:chore"]
body:
  - type: markdown
    attributes:
      value: |
        After creating the issue, apply the matching `ctx:*` label (or none if infra)
        and a `prio:*` label. Assign it to the current increment milestone.
  - type: dropdown
    id: context
    attributes:
      label: Primary context
      description: One context, or "none" for cross-cutting/infra work.
      options:
        - ctx:access
        - ctx:site
        - ctx:safety
        - ctx:corrective-actions
        - ctx:media
        - ctx:notifications
        - none (cross-cutting / infra)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs doing and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The concrete condition that closes this chore.
    validations:
      required: true
