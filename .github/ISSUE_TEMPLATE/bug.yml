name: Bug
description: A defect against expected behavior.
title: "[ctx:<context>] bug: <short description>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        After creating the issue, apply the matching `ctx:*` label (or none if infra),
        a `prio:*` label, and `offline` if it touches sync. Assign it to the current
        increment milestone.
  - type: dropdown
    id: context
    attributes:
      label: Primary context
      description: One context, or "none" for cross-cutting/infra work.
      options:
        - ctx:access
        - ctx:site
        - ctx:safety
        - ctx:corrective-actions
        - ctx:media
        - ctx:notifications
        - none (cross-cutting / infra)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: offline-context
    attributes:
      label: Offline / sync relevance
      description: Does this occur offline, on reconnect, or during sync? Write "N/A" if unrelated to sync.
    validations:
      required: false
