name: Spike
description: A time-boxed technical investigation. No production code is the outcome.
labels: ["type:spike"]
body:
  - type: markdown
    attributes:
      value: |
        Title: plain imperative, no prefix (issues convention, "Title format").

        A spike answers one technical question within a time box. This form applies
        `type:spike` and nothing else. After creating the issue, set its `ctx:*` label
        and a `prio:*` label. Assign it to its increment milestone, if it belongs to
        one.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this achieves, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is true today that makes it necessary. Link the inventory, ADR or issue it comes from.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue covers.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What it deliberately does not cover, so the scope cannot widen silently.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Invariants, stated as verifiable outcomes, never as steps.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: The method that will demonstrate those invariants.
    validations:
      required: true
  - type: input
    id: time-box
    attributes:
      label: Time box
      description: Maximum time allotted before stopping and reporting findings.
      placeholder: e.g. 1 day
    validations:
      required: true
  - type: dropdown
    id: primary-context
    attributes:
      label: Primary context
      description: Exactly one context. A dropdown cannot apply a label, so set the matching label after creation.
      options:
        - ctx:access
        - ctx:site
        - ctx:safety
        - ctx:corrective-actions
        - ctx:media
        - ctx:notifications
        - ctx:platform
    validations:
      required: true
