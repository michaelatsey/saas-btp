name: Publish API images

# Builds the API and migration runner images for one commit of main, attests them, and publishes
# them to GHCR as sha-<full SHA> (ADR-ARCH-022, ADR-ARCH-030). Called by "Deliver API to staging"
# once CI API passes on a push to main, before the commit is deployed; dispatched by hand from
# main to publish a commit again, or to complete a run where one image failed.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA (40 characters) of a commit on main
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        description: Full SHA (40 characters) of a commit on main
        required: true
        type: string

permissions:
  contents: read

# An explicit bash runs every step with -eo pipefail: a failed command inside a pipe fails the
# step.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: publish-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two runs for the same commit would race between the tag check and the push of an image.
    # Set on the job, so per image: GitHub's documentation does not say whether a called
    # workflow's top-level concurrency applies. With queue: max a waiting run is not cancelled
    # by a third one, so a delivery run's publication is never dropped and its deployment
    # always follows.
    concurrency:
      group: publish-api-images-${{ inputs.sha }}-${{ matrix.image }}
      cancel-in-progress: false
      queue: max
    # id-token and attestations let actions/attest sign with the job's OIDC token and store the
    # attestation in GitHub's attestations API, where gh attestation verify reads it back
    # (ADR-ARCH-030).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: saas-btp-api
            dockerfile: apps/api/src/hosts/SaasBtp.Api/Dockerfile
          - image: saas-btp-migrator
            dockerfile: apps/api/database/SaasBtp.Migrations/Dockerfile
    env:
      SHA: ${{ inputs.sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      # The name the build is loaded under in the runner's engine; it never reaches GHCR.
      CANDIDATE: local/${{ matrix.image }}:candidate
    steps:
      # Only the version of this workflow on main may publish. A failed step, not a skipped
      # job, so that a run dispatched from another branch cannot pass for a publication.
      - name: Check the workflow runs from main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main, not $GITHUB_REF."
            exit 1
          fi

      # The input reaches the shell through the environment only, never interpolated into a
      # script.
      - name: Check the input is a full commit SHA
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full lowercase commit SHA of 40 hexadecimal characters."
            exit 1
          fi

      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A published image is a release candidate: only reviewed code, merged into main, is built.
      - name: Check the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR has no tag immutability: a push would silently move the tag to another image, so
      # an existing tag is never pushed again. One built from this commit (revision label) ends
      # the job successfully, so a run where only the other image failed can be completed by
      # dispatching again; any other image under the tag fails the run.
      # Authenticated, GHCR answers 404 for a missing tag or package, which imagetools reports as
      # "not found". A denied read is taken as absent too: a token that cannot read a package
      # cannot push to it, so the push fails rather than overwrites. Any other failure stops the
      # run rather than being read as absent.
      # The tag is resolved to a digest once: the revision label here and the attestation in the
      # next step are read from that digest, never from the tag, which could move in between.
      - name: Check whether the tag is already published
        id: existing
        run: |
          # stderr is kept apart, so that a warning cannot mix into the digest.
          if output=$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{json .Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect.err"); then
            digest=$(tr -d '"' <<<"$output")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "$output"
              cat "$RUNNER_TEMP/inspect.err"
              echo "::error::Could not read the digest of $IMAGE:sha-$SHA."
              exit 1
            fi
            revision=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image.Config.Labels}}' \
              | jq -r '."org.opencontainers.image.revision" // empty')
            if [[ "$revision" != "$SHA" ]]; then
              echo "::error::$IMAGE:sha-$SHA ($digest) exists with revision '${revision:-<none>}'; a tag is never overwritten."
              exit 1
            fi
            echo "::notice::$IMAGE:sha-$SHA is already published from this commit as $digest; nothing is pushed."
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -q -i -E 'not found|denied' "$RUNNER_TEMP/inspect.err"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::Could not tell whether $IMAGE:sha-$SHA exists."
            exit 1
          fi

      # A published digest is accepted only with an attestation from this workflow on main, the
      # verification policy of ADR-ARCH-030 point 6, the same flags as in deploy-api-staging.yml
      # (point 5): the attestation proves where the digest was built, and the revision label
      # inside the digest names the commit. A copy of this workflow on another branch carries the
      # same path, hence the source ref. This path never attests: a provenance describes the run
      # that creates it, and this run did not build the digest.
      # Only an answer that no attestation exists reads as a missing one: the attestations API
      # answers 404 for such a digest, and gh prints "No attestations found" when it returns an
      # empty list. Any other failure, a permission or network error included, is reported with
      # gh's output as a failed verification.
      - name: Verify the attestation of the published digest
        if: steps.existing.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          if output=$(gh attestation verify "oci://$IMAGE@$DIGEST" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-api-images.yml" \
              --source-ref refs/heads/main 2>&1); then
            echo "$output"
            exit 0
          fi
          echo "$output"
          if grep -q -F -e "No attestations found" -e "HTTP 404: Not Found (https://api.github.com/repos/$GITHUB_REPOSITORY/attestations/" <<<"$output"; then
            echo "::error::$IMAGE@$DIGEST (sha-$SHA) has no attestation: it was published before images were attested, and is never attested afterwards. Publish a newer commit of main."
          else
            echo "::error::Could not verify the attestation of $IMAGE@$DIGEST (sha-$SHA); see gh's output above."
          fi
          exit 1

      # The default docker driver cannot push by digest; a docker-container builder can. Its
      # BuildKit image is pinned by digest, like the base images (ADR-ARCH-022, ADR-ARCH-030).
      - name: Create the builder
        if: steps.existing.outputs.published == 'false'
        run: |
          docker buildx create \
            --name publish \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea" \
            --use \
            --bootstrap

      # No BuildKit provenance or SBOM (ADR-ARCH-030): the published reference stays a single
      # linux/amd64 image manifest, and its provenance is the GitHub attestation created below.
      # The image is loaded under a local name only: nothing reaches GHCR before the non-root
      # check.
      - name: Build
        if: steps.existing.outputs.published == 'false'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            --metadata-file "$RUNNER_TEMP/load-metadata.json" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            --file "$DOCKERFILE" \
            --tag "$CANDIDATE" \
            .

      - name: Check the image runs as a non-root user
        if: steps.existing.outputs.published == 'false'
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' "$CANDIDATE")
          echo "User: ${user:-<unset>}"
          if [[ -z "$user" || "$user" == "0" || "$user" == root || "$user" == 0:* || "$user" == root:* ]]; then
            echo "::error::$IMAGE runs as root."
            exit 1
          fi

      # Pushed by digest, with no tag (ADR-ARCH-030): the tag is created only once this digest is
      # attested, so a run that fails from here on leaves an untagged digest, never a tag without
      # an attestation. The same build comes from BuildKit's cache; equal config digests in the
      # metadata of both builds prove the pushed image is the one checked above, since the config
      # names every layer. OCI media types are set explicitly: Docker documents the exporter's
      # default as false.
      - name: Push by digest
        id: push
        if: steps.existing.outputs.published == 'false'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,push=true,oci-mediatypes=true" \
            --metadata-file "$RUNNER_TEMP/push-metadata.json" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            --file "$DOCKERFILE" \
            .
          checked=$(jq -r '."containerimage.config.digest" // empty' "$RUNNER_TEMP/load-metadata.json")
          pushed=$(jq -r '."containerimage.config.digest" // empty' "$RUNNER_TEMP/push-metadata.json")
          digest=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/push-metadata.json")
          media_type=$(jq -r '."containerimage.descriptor".mediaType // empty' "$RUNNER_TEMP/push-metadata.json")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the pushed digest of $IMAGE."
            exit 1
          fi
          if [[ -z "$checked" || "$pushed" != "$checked" ]]; then
            echo "::error::$IMAGE@$digest has config '${pushed:-<none>}', not the checked '${checked:-<none>}'; it is neither attested nor tagged."
            exit 1
          fi
          if [[ "$media_type" != application/vnd.oci.image.manifest.v1+json ]]; then
            echo "::error::$IMAGE@$digest is a '${media_type:-<none>}', not a single image manifest."
            exit 1
          fi
          echo "Pushed $IMAGE@$digest (config $pushed)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Attested by the run that pushed the digest, and by no other (ADR-ARCH-030). The
      # attestation stays in GitHub's attestations API: nothing reads it from GHCR.
      - name: Attest the pushed digest
        id: attest
        if: steps.existing.outputs.published == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      # A sha-<SHA> tag designates an attested digest or does not exist (ADR-ARCH-030): this step
      # runs only once the attestation step has succeeded. With one image manifest as source,
      # --prefer-index=false pushes its bytes unchanged, so the tag keeps the pushed digest.
      - name: Tag the attested digest
        if: steps.existing.outputs.published == 'false' && steps.attest.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --prefer-index=false --tag "$IMAGE:sha-$SHA" "$IMAGE@$DIGEST"

      - name: Report the digest
        env:
          EXPECTED: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the digest of $IMAGE:sha-$SHA."
            exit 1
          fi
          if [[ "$digest" != "$EXPECTED" ]]; then
            echo "::error::$IMAGE:sha-$SHA designates $digest, not the attested $EXPECTED."
            exit 1
          fi
          echo "Published $IMAGE:sha-$SHA"
          echo "Deploy by digest: $IMAGE@$digest"
          {
            echo "### $IMAGE"
            echo
            echo "- Tag: \`sha-$SHA\`"
            echo "- Digest: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
